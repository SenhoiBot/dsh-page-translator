<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>DSH 整页翻译 · 设置</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #0f1115;
        color: #e5e7eb;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .card {
        max-width: 620px;
        margin: 0 auto;
        background: #151922;
        border: 1px solid #2a2f3a;
        border-radius: 14px;
        padding: 24px 28px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p.hint {
        color: #9ca3af;
        margin: 0 0 20px;
      }
      label {
        display: block;
        margin: 14px 0 6px;
        color: #cbd5e1;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        height: 34px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid #2f3542;
        background: #0f1115;
        color: #e5e7eb;
        font: inherit;
        outline: none;
      }
      input:focus,
      select:focus {
        border-color: #3b82f6;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        height: 34px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
      }
      button.secondary {
        background: #1f2937;
        color: #e5e7eb;
        border: 1px solid #374151;
      }
      #status {
        margin-top: 14px;
        min-height: 20px;
        white-space: pre-wrap;
      }
      #status[data-tone="ok"] {
        color: #34d399;
      }
      #status[data-tone="error"] {
        color: #f87171;
      }
      code {
        background: #0b0d12;
        padding: 1px 5px;
        border-radius: 5px;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>DSH 整页翻译 · 设置</h1>
      <p class="hint">
        翻译由本机正在运行的 DeepSeek Harness 提供（不是这个扩展自己调模型）。请保持 DSH 桌面版/宿主运行；
        地址栏里出现按钮后，点一下即可原地翻译，再点还原。
      </p>

      <label for="bridgeUrl">DSH 扩展桥地址</label>
      <input id="bridgeUrl" type="url" spellcheck="false" placeholder="http://127.0.0.1:34118" />
      <p class="hint" style="margin: 6px 0 0">
        默认端口 <code>34118</code>。若 DSH 插件配置改了端口，这里同步修改；可用「测试连接」确认。
      </p>

      <label for="target">目标语言</label>
      <select id="target">
        <option value="zh">简体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="ru">Русский</option>
      </select>

      <label for="token">扩展访问令牌（可选）</label>
      <input id="token" type="text" spellcheck="false" placeholder="留空表示仅本机访问" />

      <div class="row">
        <button id="save">保存</button>
        <button id="test" class="secondary">测试连接</button>
      </div>
      <div id="status"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
